<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07071a">
  <meta name="description" content="Тап-Империя — большой мобильный кликер с огромным количеством прокачки">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Тап-Империя">
  <title>Тап-Империя</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Верхняя панель: монеты, доход, валюты -->
    <header id="hud">
      <div class="hud1">
        <div class="coins"><span class="ci">🪙</span><span id="coinsVal">0</span></div>
        <button class="hbtn" data-a="ui.open:settings" aria-label="Настройки">⚙️</button>
      </div>
      <div class="hud2"><span id="cpsVal">⚡ 0/с</span><span id="tapValHud">👆 1/тап</span></div>
      <div id="curRow" class="currow" data-a="ui.curs"></div>
    </header>

    <main id="main">
      <!-- Экран тапа -->
      <section id="scrTap" class="screen active">
        <div id="stageBar"></div>
        <div id="goals"></div>
        <div id="tapZone">
          <div id="tapTop"></div>
          <div id="orbWrap">
            <div id="fingers"></div>
            <div id="orb"><span id="orbIcon">💰</span></div>
          </div>
          <div id="comboBox"></div>
          <div id="evLayer"></div>
        </div>
        <div id="tapBottom"></div>
      </section>

      <!-- Экран панелей (улучшения, здания, герой, престиж, ещё) -->
      <section id="scrPanel" class="screen">
        <div id="subTabs"></div>
        <div id="panelBody"></div>
      </section>
    </main>

    <!-- Нижние вкладки -->
    <nav id="tabs"></nav>
    <div id="weatherFx"></div>
  </div>

  <canvas id="fx"></canvas>
  <div id="flash"></div>
  <div id="modalRoot"></div>
  <div id="toasts"></div>

  <!-- Ядро -->
  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <!-- Системы -->
  <script src="js/tap.js"></script>
  <script src="js/buildings.js"></script>
  <script src="js/crit.js"></script>
  <script src="js/combo.js"></script>
  <script src="js/autotap.js"></script>
  <script src="js/boosters.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/events.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/settings.js"></script>
  <!-- Запуск -->
  <script src="js/main.js"></script>
</body>
</html>
