# Память для Gradle (декомпиляция Minecraft в genSources требует больше 1 ГБ)
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Версии Fabric — сверяйте на https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Свойства мода
mod_version=1.0.0
maven_group=dev.optimod
archives_base_name=optimod

# Зависимости
fabric_api_version=0.161.0+26.3
# Mod Menu нужен только при компиляции (необязательная интеграция)
modmenu_version=20.0.3
