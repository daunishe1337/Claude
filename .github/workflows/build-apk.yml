# Сборка APK NeoRig на GitHub Actions (там есть Android SDK и доступ к Google Maven)
name: Build NeoRig APK

on:
  push:
    branches: [ccr-28be3e23-ss7pnj]
    paths:
      - 'NeoRig/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # нужно для публикации APK в GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: NeoRig
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoRig-debug-apk
          path: NeoRig/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Готовый APK публикуется как pre-release «neorig-latest» — его можно скачать прямо с телефона
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NeoRig-debug.apk
          gh release delete neorig-latest --yes --cleanup-tag || true
          gh release create neorig-latest NeoRig-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "NeoRig — debug APK (сборка ${{ github.run_number }})" \
            --notes "APK собран GitHub Actions из коммита ${{ github.sha }}. Android 8.0+, OpenGL ES 3.0. Установка: откройте файл на телефоне и разрешите установку из этого источника."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: NeoRig/app/build/reports/tests/
          if-no-files-found: ignore
